```yaml
name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

jobs:

  # ============================================================
  # BUILD + PUSH IMAGES
  # ============================================================
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS OIDC
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # VERIFY AWS
      # ----------------------------------------------------------
      - name: Verify AWS Identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity

      # ----------------------------------------------------------
      # LOGIN TO ECR
      # ----------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # DOCKER BUILDX
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # IMAGE TAG
      # ----------------------------------------------------------
      - name: Set Image Tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG: $IMAGE_TAG"
          echo "======================================"

      # ==========================================================
      # BUILD ALL SERVICES
      # ==========================================================
      - name: Build and Push Microservices
        shell: bash
        run: |

          set -e

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "======================================"
            echo "BUILDING: $SERVICE"
            echo "======================================"

            # ----------------------------------------------------
            # DEFAULT PATH
            # ----------------------------------------------------
            CONTEXT="src/$SERVICE"
            DOCKERFILE="$CONTEXT/Dockerfile"

            # ----------------------------------------------------
            # CARTSERVICE HAS A DIFFERENT STRUCTURE
            # ----------------------------------------------------
            if [ "$SERVICE" = "cartservice" ]; then
              CONTEXT="src/cartservice/src"
              DOCKERFILE="$CONTEXT/Dockerfile"
            fi

            echo "Dockerfile: $DOCKERFILE"
            echo "Context:    $CONTEXT"

            # ----------------------------------------------------
            # VALIDATE FILES
            # ----------------------------------------------------
            if [ ! -f "$DOCKERFILE" ]; then
              echo "ERROR: Dockerfile not found:"
              echo "$DOCKERFILE"
              exit 1
            fi

            echo ""
            echo "Building image..."

            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --tag "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG" \
              --tag "$ECR_REGISTRY/$SERVICE:latest" \
              --push \
              "$CONTEXT"

            echo ""
            echo "Successfully pushed:"
            echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

          done

      # ----------------------------------------------------------
      # VERIFY ECR
      # ----------------------------------------------------------
      - name: Verify Images in ECR
        run: |

          echo "======================================"
          echo "VERIFYING ECR IMAGES"
          echo "======================================"

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "Checking $SERVICE..."

            aws ecr describe-images \
              --repository-name "$SERVICE" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              >/dev/null

            echo "$SERVICE OK"

          done


  # ============================================================
  # DEPLOY TO EKS
  # ============================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS OIDC
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # VERIFY AWS
      # ----------------------------------------------------------
      - name: Verify AWS Identity
        run: |

          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity

      # ----------------------------------------------------------
      # VERIFY EKS
      # ----------------------------------------------------------
      - name: Verify EKS Cluster
        run: |

          echo "======================================"
          echo "VERIFYING EKS"
          echo "======================================"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

      # ----------------------------------------------------------
      # INSTALL KUBECTL
      # ----------------------------------------------------------
      - name: Install kubectl
        run: |

          echo "======================================"
          echo "INSTALLING KUBECTL"
          echo "======================================"

          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"

          chmod +x kubectl

          sudo mv kubectl /usr/local/bin/kubectl

          kubectl version --client

      # ----------------------------------------------------------
      # INSTALL KUSTOMIZE
      # ----------------------------------------------------------
      - name: Install Kustomize
        run: |

          echo "======================================"
          echo "INSTALLING KUSTOMIZE"
          echo "======================================"

          KUSTOMIZE_VERSION="v5.7.1"

          curl -L \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_v5.7.1_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz

          tar -xzf /tmp/kustomize.tar.gz -C /tmp

          sudo mv /tmp/kustomize /usr/local/bin/kustomize

          kustomize version

      # ----------------------------------------------------------
      # UPDATE KUBECONFIG
      # ----------------------------------------------------------
      - name: Configure kubectl for EKS
        run: |

          echo "======================================"
          echo "CONFIGURING EKS"
          echo "======================================"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo ""
          echo "Cluster:"
          kubectl cluster-info

          echo ""
          echo "Nodes:"
          kubectl get nodes -o wide

      # ----------------------------------------------------------
      # SET IMAGE TAG
      # ----------------------------------------------------------
      - name: Set Image Tag
        run: |

          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG: $IMAGE_TAG"
          echo "======================================"

      # ==========================================================
      # UPDATE KUBERNETES MANIFESTS
      # ==========================================================
      - name: Update Kubernetes Images
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "UPDATING KUBERNETES IMAGES"
          echo "======================================"

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "Updating $SERVICE..."

            kustomize edit set image \
              "$ECR_REGISTRY/$SERVICE=$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

          done

          echo ""
          echo "Generated Kustomization:"
          cat kustomization.yaml

      # ----------------------------------------------------------
      # SHOW MANIFEST
      # ----------------------------------------------------------
      - name: Validate Kubernetes Manifests
        run: |

          echo "======================================"
          echo "VALIDATING MANIFESTS"
          echo "======================================"

          kustomize build . > /tmp/rendered.yaml

          kubectl apply \
            --dry-run=client \
            -f /tmp/rendered.yaml

          echo ""
          echo "Manifest validation successful."

      # ----------------------------------------------------------
      # DEPLOY
      # ----------------------------------------------------------
      - name: Deploy to EKS
        run: |

          echo "======================================"
          echo "DEPLOYING TO EKS"
          echo "======================================"

          kustomize build . | kubectl apply -f -

      # ----------------------------------------------------------
      # SHOW PODS
      # ----------------------------------------------------------
      - name: Show Deployment Status
        run: |

          echo "======================================"
          echo "DEPLOYMENT STATUS"
          echo "======================================"

          kubectl get deployments

          echo ""
          kubectl get pods -o wide

          echo ""
          kubectl get services

      # ==========================================================
      # WAIT FOR DEPLOYMENTS
      # ==========================================================
      - name: Wait for Deployments
        shell: bash
        run: |

          set +e

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          FAILED=0

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo ""
            echo "======================================"
            echo "WAITING FOR: $DEPLOYMENT"
            echo "======================================"

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=5m

            RESULT=$?

            if [ $RESULT -ne 0 ]; then
              echo "FAILED: $DEPLOYMENT"
              FAILED=1
            else
              echo "READY: $DEPLOYMENT"
            fi

          done

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "======================================"
            echo "DEPLOYMENT FAILED"
            echo "======================================"

            kubectl get pods -o wide

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ALL DEPLOYMENTS READY"
          echo "======================================"

      # ==========================================================
      # DIAGNOSTICS
      # ==========================================================
      - name: Diagnostics
        if: always()
        run: |

          echo "======================================"
          echo "FINAL CLUSTER STATUS"
          echo "======================================"

          echo ""
          echo "NODES:"
          kubectl get nodes -o wide

          echo ""
          echo "PODS:"
          kubectl get pods -o wide

          echo ""
          echo "SERVICES:"
          kubectl get services

          echo ""
          echo "DEPLOYMENTS:"
          kubectl get deployments

          echo ""
          echo "EVENTS:"
          kubectl get events \
            --sort-by='.lastTimestamp' \
            | tail -100

          echo ""
          echo "POD DESCRIPTIONS:"
          
          for POD in $(kubectl get pods \
            --field-selector=status.phase!=Running \
            -o name); do

            echo ""
            echo "======================================"
            echo "$POD"
            echo "======================================"

            kubectl describe "$POD" || true

          done

      # ----------------------------------------------------------
      # FINAL SUCCESS
      # ----------------------------------------------------------
      - name: Deployment Complete
        run: |

          echo "======================================"
          echo "DEPLOYMENT COMPLETE"
          echo "======================================"

          kubectl get pods

          echo ""
          echo "Application deployed successfully to:"
          echo "EKS Cluster: $EKS_CLUSTER"
          echo "Region:      $AWS_REGION"
```
