
name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

  # Change this if your main kustomization.yaml is somewhere else.
  KUSTOMIZATION_FILE: kustomize/kustomization.yaml


# ============================================================
# 1. DETECT CHANGES
# ============================================================

jobs:

  detect-changes:

    name: Detect Changed Services

    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      manifests_changed: ${{ steps.detect.outputs.manifests_changed }}

    steps:

      # --------------------------------------------------------
      # Checkout complete history
      # --------------------------------------------------------

      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Detect changed services
      # --------------------------------------------------------

      - name: Detect changed services

        id: detect

        shell: bash

        run: |

          set -e

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          CHANGED_SERVICES=()

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "======================================"
          echo "CHANGE DETECTION"
          echo "======================================"

          echo "BEFORE: $BEFORE"
          echo "AFTER:  $AFTER"

          echo ""
          echo "Changed files:"
          echo "--------------------------------------"

          git diff --name-only "$BEFORE" "$AFTER"

          echo ""
          echo "======================================"
          echo "SERVICE DETECTION"
          echo "======================================"

          for SERVICE in "${SERVICES[@]}"; do

            if git diff --quiet "$BEFORE" "$AFTER" -- "src/$SERVICE"; then

              echo "UNCHANGED: $SERVICE"

            else

              echo "CHANGED:   $SERVICE"

              CHANGED_SERVICES+=("$SERVICE")

            fi

          done


          # ====================================================
          # Detect Kubernetes / Kustomize changes
          # ====================================================

          echo ""
          echo "======================================"
          echo "KUBERNETES CHANGE DETECTION"
          echo "======================================"

          if git diff --quiet "$BEFORE" "$AFTER" -- \
            'kustomization.yaml' \
            'kustomize/' \
            'kubernetes/' \
            'k8s/' \
            'manifests/' \
            '*.yaml' \
            '*.yml'; then

            MANIFESTS_CHANGED="false"

          else

            MANIFESTS_CHANGED="true"

          fi


          # ====================================================
          # Convert services to JSON
          # ====================================================

          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then

            SERVICES_JSON="[]"
            HAS_CHANGES="false"

          else

            SERVICES_JSON=$(
              printf '%s\n' "${CHANGED_SERVICES[@]}" |
              sort -u |
              jq -R . |
              jq -sc .
            )

            HAS_CHANGES="true"

          fi


          # ====================================================
          # Outputs
          # ====================================================

          echo ""
          echo "======================================"
          echo "DETECTION RESULT"
          echo "======================================"

          echo "Changed services:"
          echo "$SERVICES_JSON"

          echo ""
          echo "Has image changes:"
          echo "$HAS_CHANGES"

          echo ""
          echo "Kubernetes manifests changed:"
          echo "$MANIFESTS_CHANGED"

          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

          echo "manifests_changed=$MANIFESTS_CHANGED" >> "$GITHUB_OUTPUT"


# ============================================================
# 2. BUILD AND PUSH ONLY CHANGED SERVICES
# ============================================================

  build-and-push:

    name: Build and Push Changed Images

    runs-on: ubuntu-latest

    needs:
      - detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS
      # --------------------------------------------------------

      - name: Verify AWS Identity

        run: |

          aws sts get-caller-identity


      # --------------------------------------------------------
      # Login ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR

        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Image tag
      # --------------------------------------------------------

      - name: Set Image Tag

        shell: bash

        run: |

          set -e

          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo ""
          echo "IMAGE TAG:"
          echo "$IMAGE_TAG"


      # --------------------------------------------------------
      # Build only changed services
      # --------------------------------------------------------

      - name: Build and Push Changed Images

        shell: bash

        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}

        run: |

          set -e

          echo "======================================"
          echo "BUILDING CHANGED SERVICES"
          echo "======================================"

          echo "Changed services:"
          echo "$CHANGED_SERVICES"

          mapfile -t SERVICES < <(
            echo "$CHANGED_SERVICES" |
            jq -r '.[]'
          )


          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "======================================"
            echo "SERVICE: $SERVICE"
            echo "======================================"

            CONTEXT="src/$SERVICE"
            DOCKERFILE="$CONTEXT/Dockerfile"


            # cartservice Dockerfile
            if [ "$SERVICE" = "cartservice" ]; then

              CONTEXT="src/cartservice/src"

              DOCKERFILE="src/cartservice/src/Dockerfile"

            fi


            echo "Context:"
            echo "$CONTEXT"

            echo ""

            echo "Dockerfile:"
            echo "$DOCKERFILE"


            # Verify Dockerfile exists

            if [ ! -f "$DOCKERFILE" ]; then

              echo ""
              echo "ERROR: Dockerfile not found:"
              echo "$DOCKERFILE"

              exit 1

            fi


            echo ""
            echo "Building:"
            echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"


            # --------------------------------------------------
            # Build + push
            # --------------------------------------------------

            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --tag "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG" \
              --tag "$ECR_REGISTRY/$SERVICE:latest" \
              --push \
              "$CONTEXT"


            echo ""
            echo "SUCCESS:"
            echo "$SERVICE"


          done


# ============================================================
# 3. DEPLOY TO EKS
# ============================================================

  deploy:

    name: Deploy to EKS

    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-and-push

    if: |
      always() &&
      (
        needs.detect-changes.outputs.has_changes == 'true' ||
        needs.detect-changes.outputs.manifests_changed == 'true'
      ) &&
      (
        needs.build-and-push.result == 'success' ||
        needs.build-and-push.result == 'skipped'
      )

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS
      # --------------------------------------------------------

      - name: Verify AWS Identity

        run: |

          aws sts get-caller-identity


      # ========================================================
      # EKS
      # ========================================================

      - name: Configure kubectl

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "CONFIGURING EKS"
          echo "======================================"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo ""

          kubectl cluster-info

          echo ""

          kubectl get nodes -o wide


      # ========================================================
      # KUSTOMIZE
      # ========================================================

      - name: Install Kustomize

        shell: bash

        run: |

          set -e

          KUSTOMIZE_VERSION="v5.7.1"

          curl -L \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz

          tar -xzf /tmp/kustomize.tar.gz -C /tmp

          sudo mv /tmp/kustomize /usr/local/bin/kustomize

          echo ""

          kustomize version


      # ========================================================
      # CHECK KUSTOMIZATION
      # ========================================================

      - name: Check Kustomization

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "CHECKING KUSTOMIZATION"
          echo "======================================"

          if [ ! -f "$KUSTOMIZATION_FILE" ]; then

            echo ""
            echo "ERROR:"
            echo "Kustomization file not found:"
            echo "$KUSTOMIZATION_FILE"

            echo ""
            echo "Available kustomization files:"

            find . \
              -type f \
              -name "kustomization.yaml" \
              -print

            exit 1

          fi


          KUSTOMIZATION_DIR=$(dirname "$KUSTOMIZATION_FILE")

          echo ""
          echo "Kustomization:"
          echo "$KUSTOMIZATION_FILE"

          echo ""
          echo "Directory:"
          echo "$KUSTOMIZATION_DIR"

          echo ""
          echo "Contents:"
          cat "$KUSTOMIZATION_FILE"


          echo "KUSTOMIZATION_DIR=$KUSTOMIZATION_DIR" >> "$GITHUB_ENV"


      # ========================================================
      # UPDATE ONLY CHANGED IMAGES
      # ========================================================

      - name: Update Changed Kubernetes Images

        shell: bash

        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}

        run: |

          set -e

          echo "======================================"
          echo "UPDATING KUBERNETES IMAGES"
          echo "======================================"

          echo "Changed services:"
          echo "$CHANGED_SERVICES"


          # ----------------------------------------------------
          # No image changes
          # ----------------------------------------------------

          if [ "$CHANGED_SERVICES" = "[]" ]; then

            echo ""
            echo "NO IMAGE CHANGES"

            echo "Existing ECR images will be kept."

            exit 0

          fi


          # ----------------------------------------------------
          # Change only modified services
          # ----------------------------------------------------

          mapfile -t SERVICES < <(
            echo "$CHANGED_SERVICES" |
            jq -r '.[]'
          )


          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"


          cd "$KUSTOMIZATION_DIR"


          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "Updating:"
            echo "$SERVICE"

            echo "New image:"
            echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"


            kustomize edit set image \
              "$ECR_REGISTRY/$SERVICE=$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

          done


          echo ""
          echo "======================================"
          echo "FINAL KUSTOMIZATION"
          echo "======================================"

          cat kustomization.yaml


      # ========================================================
      # VALIDATE
      # ========================================================

      - name: Validate Kubernetes Manifests

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "VALIDATING MANIFESTS"
          echo "======================================"


          cd "$KUSTOMIZATION_DIR"


          kustomize build . > /tmp/rendered.yaml


          echo ""
          echo "Rendered manifest generated."


          kubectl apply \
            --dry-run=client \
            -f /tmp/rendered.yaml


          echo ""
          echo "Manifest validation successful."


      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy to EKS

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "DEPLOYING TO EKS"
          echo "======================================"


          cd "$KUSTOMIZATION_DIR"


          kustomize build . |
            kubectl apply -f -


          echo ""
          echo "Kubernetes resources applied successfully."


      # ========================================================
      # STATUS
      # ========================================================

      - name: Show Deployment Status

        shell: bash

        run: |

          echo "======================================"
          echo "DEPLOYMENT STATUS"
          echo "======================================"


          echo ""
          echo "DEPLOYMENTS:"

          kubectl get deployments


          echo ""
          echo "PODS:"

          kubectl get pods -o wide


          echo ""
          echo "SERVICES:"

          kubectl get services


      # ========================================================
      # WAIT FOR DEPLOYMENTS
      # ========================================================

      - name: Wait for Deployments

        shell: bash

        run: |

          set +e

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          FAILED=0


          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo ""
            echo "======================================"
            echo "WAITING FOR: $DEPLOYMENT"
            echo "======================================"


            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=5m


            if [ $? -ne 0 ]; then

              echo ""
              echo "FAILED: $DEPLOYMENT"

              kubectl describe deployment "$DEPLOYMENT" || true

              echo ""
              echo "Pods:"

              kubectl get pods \
                -l "app=$DEPLOYMENT" \
                -o wide || true

              FAILED=1

            else

              echo ""
              echo "READY: $DEPLOYMENT"

            fi

          done


          if [ "$FAILED" -ne 0 ]; then

            exit 1

          fi


      # ========================================================
      # DIAGNOSTICS
      # ========================================================

      - name: Diagnostics

        if: always()

        shell: bash

        run: |

          echo "======================================"
          echo "FINAL CLUSTER STATUS"
          echo "======================================"


          echo ""
          echo "NODES:"

          kubectl get nodes -o wide || true


          echo ""
          echo "PODS:"

          kubectl get pods -o wide || true


          echo ""
          echo "DEPLOYMENTS:"

          kubectl get deployments || true


          echo ""
          echo "SERVICES:"

          kubectl get services || true


          echo ""
          echo "INGRESS:"

          kubectl get ingress || true


          echo ""
          echo "RECENT EVENTS:"

          kubectl get events \
            --sort-by='.lastTimestamp' |
            tail -100 || true
