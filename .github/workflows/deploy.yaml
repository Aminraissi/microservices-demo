name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

jobs:

  # ============================================================
  # BUILD AND PUSH IMAGES
  # ============================================================

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG"
          echo "======================================"
          echo "$IMAGE_TAG"

      - name: Build and Push Images
        shell: bash
        run: |
          set -e

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "======================================"
            echo "BUILDING: $SERVICE"
            echo "======================================"

            # Default configuration
            CONTEXT="src/$SERVICE"
            DOCKERFILE="$CONTEXT/Dockerfile"

            # cartservice has Dockerfile and .csproj
            # inside src/cartservice/src
            if [ "$SERVICE" = "cartservice" ]; then
              CONTEXT="src/cartservice/src"
              DOCKERFILE="src/cartservice/src/Dockerfile"
            fi

            echo "Dockerfile: $DOCKERFILE"
            echo "Context:    $CONTEXT"

            # Verify Dockerfile
            if [ ! -f "$DOCKERFILE" ]; then
              echo "ERROR: Dockerfile not found:"
              echo "$DOCKERFILE"
              exit 1
            fi

            # Verify cartservice project
            if [ "$SERVICE" = "cartservice" ]; then
              if [ ! -f "$CONTEXT/cartservice.csproj" ]; then
                echo "ERROR: cartservice.csproj not found:"
                echo "$CONTEXT/cartservice.csproj"
                exit 1
              fi
            fi

            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --tag "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG" \
              --tag "$ECR_REGISTRY/$SERVICE:latest" \
              --push \
              "$CONTEXT"

            echo ""
            echo "Successfully pushed:"
            echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

          done


  # ============================================================
  # DEPLOY TO EKS
  # ============================================================

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity


      # ========================================================
      # VERIFY EKS
      # ========================================================

      - name: Verify EKS Cluster
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING EKS"
          echo "======================================"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text


      # ========================================================
      # INSTALL KUBECTL
      # ========================================================

      - name: Install kubectl
        shell: bash
        run: |
          set -e

          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)

          curl -LO \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl

          sudo mv kubectl /usr/local/bin/kubectl

          kubectl version --client


      # ========================================================
      # INSTALL KUSTOMIZE
      # ========================================================

      - name: Install Kustomize
        shell: bash
        run: |
          set -e

          KUSTOMIZE_VERSION="v5.7.1"

          echo "Installing Kustomize $KUSTOMIZE_VERSION"

          rm -rf /tmp/kustomize
          rm -f /tmp/kustomize.tar.gz

          curl -L \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz

          mkdir -p /tmp/kustomize

          tar -xzf /tmp/kustomize.tar.gz \
            -C /tmp/kustomize

          sudo install \
            /tmp/kustomize/kustomize \
            /usr/local/bin/kustomize

          kustomize version


      # ========================================================
      # CONFIGURE KUBECTL
      # ========================================================

      - name: Configure kubectl for EKS
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURING EKS"
          echo "======================================"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo ""
          echo "CLUSTER:"
          kubectl cluster-info

          echo ""
          echo "NODES:"
          kubectl get nodes -o wide


      # ========================================================
      # SET IMAGE TAG
      # ========================================================

      - name: Set Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG"
          echo "======================================"
          echo "$IMAGE_TAG"


      # ========================================================
      # UPDATE KUSTOMIZE IMAGES
      # ========================================================

      - name: Update Kubernetes Images
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "UPDATING KUBERNETES IMAGES"
          echo "======================================"

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo "Updating $SERVICE"

            kustomize edit set image \
              "$ECR_REGISTRY/$SERVICE=$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

          done

          echo ""
          echo "======================================"
          echo "FINAL KUSTOMIZATION"
          echo "======================================"

          cat kustomization.yaml


      # ========================================================
      # VALIDATE MANIFESTS
      # ========================================================

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VALIDATING MANIFESTS"
          echo "======================================"

          kustomize build . > /tmp/rendered.yaml

          kubectl apply \
            --dry-run=client \
            -f /tmp/rendered.yaml

          echo ""
          echo "Manifest validation successful."


      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy to EKS
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DEPLOYING TO EKS"
          echo "======================================"

          kustomize build . | kubectl apply -f -

          echo ""
          echo "Deployment applied successfully."


      # ========================================================
      # SHOW STATUS
      # ========================================================

      - name: Show Deployment Status
        shell: bash
        run: |
          echo "======================================"
          echo "DEPLOYMENT STATUS"
          echo "======================================"

          echo ""
          echo "DEPLOYMENTS:"
          kubectl get deployments

          echo ""
          echo "PODS:"
          kubectl get pods -o wide

          echo ""
          echo "SERVICES:"
          kubectl get services


      # ========================================================
      # WAIT FOR DEPLOYMENTS
      # ========================================================

      - name: Wait for Deployments
        shell: bash
        run: |
          set +e

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          FAILED=0

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo ""
            echo "======================================"
            echo "WAITING FOR: $DEPLOYMENT"
            echo "======================================"

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=5m

            if [ $? -ne 0 ]; then
              echo "FAILED: $DEPLOYMENT"
              FAILED=1
            else
              echo "READY: $DEPLOYMENT"
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "One or more deployments failed."

            exit 1
          fi


      # ========================================================
      # DIAGNOSTICS
      # ========================================================

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL CLUSTER STATUS"
          echo "======================================"

          echo ""
          echo "NODES:"
          kubectl get nodes -o wide || true

          echo ""
          echo "PODS:"
          kubectl get pods -o wide || true

          echo ""
          echo "DEPLOYMENTS:"
          kubectl get deployments || true

          echo ""
          echo "SERVICES:"
          kubectl get services || true

          echo ""
          echo "POD EVENTS:"
          kubectl get events \
            --sort-by='.lastTimestamp' \
            | tail -100 || true

          echo ""
          echo "POD DESCRIPTIONS:"
          kubectl describe pods || true
