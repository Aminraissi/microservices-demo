name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

jobs:

  # ============================================================
  # DETECT CHANGES
  # ============================================================

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      manifests_changed: ${{ steps.detect.outputs.manifests_changed }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -e

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          CHANGED_SERVICES=()

          echo "======================================"
          echo "CHECKING CHANGED FILES"
          echo "======================================"

          git diff --name-only HEAD^ HEAD

          for SERVICE in "${SERVICES[@]}"; do
            if git diff --quiet HEAD^ HEAD -- "src/$SERVICE"; then
              echo "UNCHANGED: $SERVICE"
            else
              echo "CHANGED:   $SERVICE"
              CHANGED_SERVICES+=("$SERVICE")
            fi
          done

          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            SERVICES_JSON="[]"
            HAS_CHANGES="false"
          else
            SERVICES_JSON=$(
              printf '%s\n' "${CHANGED_SERVICES[@]}" |
              jq -R . |
              jq -sc .
            )

            HAS_CHANGES="true"
          fi

          # Helm/chart/values changes must trigger deployment
          # even when no application image changed.
          if git diff --quiet HEAD^ HEAD -- \
            Chart.yaml \
            values.yaml \
            helm/ \
            helm-chart/ \
            charts/; then
            MANIFESTS_CHANGED="false"
          else
            MANIFESTS_CHANGED="true"
          fi

          echo ""
          echo "Changed services:"
          echo "$SERVICES_JSON"

          echo ""
          echo "Has image changes: $HAS_CHANGES"

          echo ""
          echo "Helm/chart changes: $MANIFESTS_CHANGED"

          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "manifests_changed=$MANIFESTS_CHANGED" >> "$GITHUB_OUTPUT"


  # ============================================================
  # BUILD AND PUSH
  # ============================================================

  build-and-push:
    name: Build and Push Changed Images
    runs-on: ubuntu-latest

    needs: detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # AWS CREDENTIALS - KEEP THE WORKING ROLE
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # ECR LOGIN
      # ========================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================
      # DOCKER BUILDX
      # ========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # IMAGE TAG
      # ========================================================

      - name: Set Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG"
          echo "======================================"
          echo "$IMAGE_TAG"

      # ========================================================
      # BUILD AND PUSH
      # ========================================================

      - name: Build and Push Changed Images
        shell: bash
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          set -e

          echo "======================================"
          echo "BUILDING CHANGED SERVICES"
          echo "======================================"

          mapfile -t SERVICES < <(
            echo "$CHANGED_SERVICES" | jq -r '.[]'
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "======================================"
            echo "BUILDING: $SERVICE"
            echo "======================================"

            CONTEXT="src/$SERVICE"
            DOCKERFILE="$CONTEXT/Dockerfile"

            # Cartservice has a different Docker build structure.
            if [ "$SERVICE" = "cartservice" ]; then
              CONTEXT="src/cartservice/src"
              DOCKERFILE="src/cartservice/src/Dockerfile"
            fi

            echo "Dockerfile: $DOCKERFILE"
            echo "Context:    $CONTEXT"

            test -f "$DOCKERFILE"

            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --tag "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG" \
              --tag "$ECR_REGISTRY/$SERVICE:latest" \
              --push \
              "$CONTEXT"

            echo ""
            echo "Successfully pushed:"
            echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

          done


  # ============================================================
  # DEPLOY TO EKS WITH HELM
  # ============================================================

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-and-push

    if: |
      always() &&
      (
        needs.detect-changes.outputs.has_changes == 'true' ||
        needs.detect-changes.outputs.manifests_changed == 'true'
      ) &&
      needs.build-and-push.result != 'failure'

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # AWS - KEEP THE WORKING ROLE
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # EKS
      # ========================================================

      - name: Configure kubectl
        shell: bash
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo "======================================"
          echo "CLUSTER"
          echo "======================================"

          kubectl cluster-info
          kubectl get nodes -o wide

      # ========================================================
      # HELM
      # ========================================================

      - name: Install Helm
        uses: azure/setup-helm@v4

      # ========================================================
      # FIND HELM CHART
      # ========================================================

      - name: Find Helm Chart
        shell: bash
        run: |
          set -e

          CHART_FILE=$(find . \
            -name Chart.yaml \
            -type f \
            | head -1)

          if [ -z "$CHART_FILE" ]; then
            echo "ERROR: Chart.yaml not found"
            exit 1
          fi

          HELM_CHART_DIR=$(dirname "$CHART_FILE")

          echo "HELM_CHART_DIR=$HELM_CHART_DIR" >> "$GITHUB_ENV"

          echo "Found Helm chart:"
          echo "$HELM_CHART_DIR"

          echo ""
          echo "Chart:"
          cat "$CHART_FILE"

      # ========================================================
      # IMAGE TAG
      # ========================================================

      - name: Set Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "IMAGE TAG:"
          echo "$IMAGE_TAG"

      # ========================================================
      # VERIFY VALUES.YAML
      # ========================================================

      - name: Verify values.yaml
        shell: bash
        run: |
          set -e

          VALUES_FILE="$HELM_CHART_DIR/values.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: values.yaml not found at $VALUES_FILE"
            exit 1
          fi

          echo "======================================"
          echo "values.yaml"
          echo "======================================"

          cat "$VALUES_FILE"

      # ========================================================
      # RENDER HELM
      # ========================================================

      - name: Render Helm manifests
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "HELM TEMPLATE"
          echo "======================================"

          helm template onlineboutique "$HELM_CHART_DIR" \
            --set images.repository="$ECR_REGISTRY" \
            --set images.tag="$IMAGE_TAG" \
            --set cartDatabase.type=redis \
            --set-string cartDatabase.connectionString="googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True" \
            --set cartDatabase.inClusterRedis.create=false \
            --set cartDatabase.externalRedisTlsOrigination.enable=false \
            > /tmp/rendered.yaml

          echo ""
          echo "Checking REDIS_ADDR / Redis configuration..."

          grep -A5 -B2 "REDIS_ADDR" /tmp/rendered.yaml || true

          echo ""
          echo "Checking frontend image..."

          grep -A2 "name: frontend" /tmp/rendered.yaml | head -20 || true

      # ========================================================
      # HELM DEPLOY
      # ========================================================

      - name: Deploy with Helm
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DEPLOYING WITH HELM"
          echo "======================================"

          helm upgrade --install onlineboutique "$HELM_CHART_DIR" \
            --namespace default \
            --set images.repository="$ECR_REGISTRY" \
            --set images.tag="$IMAGE_TAG" \
            --set cartDatabase.type=redis \
            --set-string cartDatabase.connectionString="googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True" \
            --set cartDatabase.inClusterRedis.create=false \
            --set cartDatabase.externalRedisTlsOrigination.enable=false \
            --wait \
            --timeout 10m

          echo ""
          echo "Helm deployment completed."

      # ========================================================
      # VERIFY CARTSERVICE REDIS
      # ========================================================

      - name: Verify Cartservice Redis Configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING CARTSERVICE"
          echo "======================================"

          kubectl rollout status \
            deployment/cartservice \
            --timeout=5m

          echo ""
          echo "REDIS_ADDR currently running in Kubernetes:"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}'

          echo ""

          echo ""
          echo "Cartservice image:"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      # ========================================================
      # VERIFY FRONTEND
      # ========================================================

      - name: Verify Frontend
        shell: bash
        run: |
          set -e

          kubectl rollout status \
            deployment/frontend \
            --timeout=5m

          echo ""
          echo "Frontend image:"

          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      # ========================================================
      # WAIT FOR ALL SERVICES
      # ========================================================

      - name: Wait for Deployments
        shell: bash
        run: |
          set +e

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
            redis-cart
            loadgenerator
          )

          FAILED=0

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo ""
            echo "======================================"
            echo "WAITING FOR $DEPLOYMENT"
            echo "======================================"

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=5m

            if [ $? -ne 0 ]; then
              echo "FAILED: $DEPLOYMENT"
              kubectl describe deployment "$DEPLOYMENT" || true
              FAILED=1
            else
              echo "READY: $DEPLOYMENT"
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ========================================================
      # FINAL STATUS
      # ========================================================

      - name: Show Deployment Status
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "DEPLOYMENT STATUS"
          echo "======================================"

          echo ""
          echo "DEPLOYMENTS:"
          kubectl get deployments

          echo ""
          echo "PODS:"
          kubectl get pods -o wide

          echo ""
          echo "SERVICES:"
          kubectl get services

          echo ""
          echo "FRONTEND IMAGE:"
          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}' || true

          echo ""

          echo ""
          echo "CARTSERVICE IMAGE:"
          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].image}' || true

          echo ""

          echo ""
          echo "CARTSERVICE REDIS:"
          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}' || true

          echo ""

      # ========================================================
      # DIAGNOSTICS
      # ========================================================

      - name: Diagnostics
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "FINAL CLUSTER STATUS"
          echo "======================================"

          echo ""
          echo "NODES:"
          kubectl get nodes -o wide || true

          echo ""
          echo "PODS:"
          kubectl get pods -o wide || true

          echo ""
          echo "DEPLOYMENTS:"
          kubectl get deployments || true

          echo ""
          echo "SERVICES:"
          kubectl get services || true

          echo ""
          echo "RECENT EVENTS:"
          kubectl get events \
            --sort-by='.lastTimestamp' |
            tail -100 || true
