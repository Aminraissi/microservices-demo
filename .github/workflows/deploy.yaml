name: CI/CD - Build and Deploy to EKS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 501161805281.dkr.ecr.eu-west-1.amazonaws.com
  EKS_CLUSTER: googleCluster
  KUSTOMIZE_PATH: kustomize/overlays/aws-ecr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Generate image tag
      id: tag
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        IMAGE_TAG="${COMMIT_SHA}-${TIMESTAMP}"
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "📦 Image tag: $IMAGE_TAG"
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::501161805281:role/github-actions-eks-deployer
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push images
      run: |
        SERVICES=(
          "frontend"
          "cartservice"
          "paymentservice"
          "productcatalogservice"
          "currencyservice"
          "checkoutservice"
          "shippingservice"
          "emailservice"
          "recommendationservice"
          "adservice"
          "loadgenerator"
        )
        
        IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
        echo "🏗️ Building with tag: $IMAGE_TAG"
        
        for SERVICE in "${SERVICES[@]}"; do
          echo "📦 Building $SERVICE..."
          
          if [ "$SERVICE" == "cartservice" ]; then
            DOCKERFILE_PATH="src/cartservice/src/Dockerfile"
            CONTEXT_PATH="src/cartservice"
          else
            DOCKERFILE_PATH="src/${SERVICE}/Dockerfile"
            CONTEXT_PATH="src/${SERVICE}"
          fi
          
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ env.ECR_REGISTRY }}/$SERVICE:latest \
            -t ${{ env.ECR_REGISTRY }}/$SERVICE:$IMAGE_TAG \
            -f $DOCKERFILE_PATH \
            --push \
            $CONTEXT_PATH
          
          echo "✅ $SERVICE pushed: latest, $IMAGE_TAG"
        done

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::501161805281:role/github-actions-eks-deployer
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Install Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/
        kustomize version
    
    - name: Update Kubernetes manifests with new images
      run: |
        IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
        echo "🔄 Updating manifests with tag: $IMAGE_TAG"
        
        cd ${{ env.KUSTOMIZE_PATH }}
        
        SERVICES=(
          "frontend"
          "cartservice"
          "paymentservice"
          "productcatalogservice"
          "currencyservice"
          "checkoutservice"
          "shippingservice"
          "emailservice"
          "recommendationservice"
          "adservice"
          "loadgenerator"
        )
        
        for SERVICE in "${SERVICES[@]}"; do
          kustomize edit set image \
            ${{ env.ECR_REGISTRY }}/$SERVICE:$IMAGE_TAG \
            ${{ env.ECR_REGISTRY }}/$SERVICE:latest
        done
        
        echo "✅ Manifests updated"
    
    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.EKS_CLUSTER }}
        kubectl get nodes
    
    - name: Deploy to EKS
      run: |
        echo "☸️ Deploying to EKS..."
        cd ${{ env.KUSTOMIZE_PATH }}
        kubectl apply -k . --namespace=default
        echo "✅ Deployment applied"
    
    - name: Wait for rollout
      run: |
        echo "⏳ Waiting for deployments to be ready..."
        kubectl rollout status deployment/frontend --timeout=5m
        kubectl rollout status deployment/cartservice --timeout=5m
        kubectl rollout status deployment/paymentservice --timeout=5m
        echo "✅ All deployments ready"
    
    - name: Get service URL
      run: |
        FRONTEND_URL=$(kubectl get service frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        echo "🌐 Application URL: http://$FRONTEND_URL"
        echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
    
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 New Images" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Service | Image Tag |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-----------|" >> $GITHUB_STEP_SUMMARY
        
        kubectl get pods -o custom-columns="SERVICE:.metadata.labels.app,TAG:.spec.containers[*].image" | while read line; do
          echo "| $line |" >> $GITHUB_STEP_SUMMARY
        done
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 Application URL" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "http://${{ env.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY