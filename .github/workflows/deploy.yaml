name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"
  EKS_CLUSTER: googleCluster
  AWS_ROLE_ARN: arn:aws:iam::501161805281:role/test

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # BUILD AND PUSH
  # ============================================================

  build-and-push:

    name: Build and Push Images

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Generate image tag
      # --------------------------------------------------------

      - name: Generate image tag
        id: tag
        shell: bash
        run: |

          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "IMAGE TAG"
          echo "======================================"
          echo "$IMAGE_TAG"

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions

      # --------------------------------------------------------
      # Verify AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |

          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity

      # --------------------------------------------------------
      # ECR Login
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Setup Buildx
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build and push
      # --------------------------------------------------------

      - name: Build and push microservices
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}

        run: |

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"
          do

            echo ""
            echo "======================================"
            echo "BUILDING: $SERVICE"
            echo "======================================"

            if [ "$SERVICE" = "cartservice" ]; then
              DOCKERFILE="src/cartservice/src/Dockerfile"
              CONTEXT="src/cartservice"
            else
              DOCKERFILE="src/${SERVICE}/Dockerfile"
              CONTEXT="src/${SERVICE}"
            fi

            echo "Dockerfile: $DOCKERFILE"
            echo "Context:    $CONTEXT"

            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --tag "${ECR_REGISTRY}/${SERVICE}:${IMAGE_TAG}" \
              --tag "${ECR_REGISTRY}/${SERVICE}:latest" \
              --push \
              "$CONTEXT"

            echo ""
            echo "Successfully pushed:"
            echo "${ECR_REGISTRY}/${SERVICE}:${IMAGE_TAG}"

          done

      # --------------------------------------------------------
      # Verify images
      # --------------------------------------------------------

      - name: Verify ECR images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}

        run: |

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"
          do

            echo "Checking $SERVICE..."

            aws ecr describe-images \
              --repository-name "$SERVICE" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION"

          done


  # ============================================================
  # DEPLOY TO EKS
  # ============================================================

  deploy:

    name: Deploy to EKS

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions

      # --------------------------------------------------------
      # Verify AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |

          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity

      # --------------------------------------------------------
      # Verify EKS
      # --------------------------------------------------------

      - name: Verify EKS cluster
        run: |

          echo "======================================"
          echo "EKS CLUSTER"
          echo "======================================"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

      # --------------------------------------------------------
      # Configure kubectl
      # --------------------------------------------------------

      - name: Configure kubectl
        run: |

          echo "======================================"
          echo "CONFIGURING EKS"
          echo "======================================"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo ""
          echo "======================================"
          echo "NODES"
          echo "======================================"

          kubectl get nodes

      # --------------------------------------------------------
      # Generate ECR overlay
      # --------------------------------------------------------

      - name: Generate ECR Kustomize overlay
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

        run: |

          echo "======================================"
          echo "GENERATING KUSTOMIZE OVERLAY"
          echo "======================================"

          mkdir -p kustomize/overlays/aws-ecr

          cat > kustomize/overlays/aws-ecr/kustomization.yaml <<EOF

          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          resources:
            - ../../base

          images:

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
              newName: ${ECR_REGISTRY}/adservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
              newName: ${ECR_REGISTRY}/cartservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice
              newName: ${ECR_REGISTRY}/checkoutservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice
              newName: ${ECR_REGISTRY}/currencyservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice
              newName: ${ECR_REGISTRY}/emailservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
              newName: ${ECR_REGISTRY}/frontend
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator
              newName: ${ECR_REGISTRY}/loadgenerator
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
              newName: ${ECR_REGISTRY}/paymentservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice
              newName: ${ECR_REGISTRY}/productcatalogservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice
              newName: ${ECR_REGISTRY}/recommendationservice
              newTag: ${IMAGE_TAG}

            - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice
              newName: ${ECR_REGISTRY}/shippingservice
              newTag: ${IMAGE_TAG}

          EOF

          echo ""
          echo "IMAGE TAG:"
          echo "$IMAGE_TAG"

      # --------------------------------------------------------
      # Validate Kustomize
      # --------------------------------------------------------

      - name: Validate Kubernetes manifests
        run: |

          echo "======================================"
          echo "KUSTOMIZE BUILD"
          echo "======================================"

          kubectl kustomize \
            kustomize/overlays/aws-ecr \
            > /tmp/manifests.yaml

          echo ""
          echo "======================================"
          echo "CONTAINER IMAGES"
          echo "======================================"

          grep "image:" /tmp/manifests.yaml

      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - name: Deploy to EKS
        run: |

          echo "======================================"
          echo "DEPLOYING TO EKS"
          echo "======================================"

          kubectl apply \
            -k kustomize/overlays/aws-ecr \
            --namespace default

      # --------------------------------------------------------
      # Restart deployments
      # --------------------------------------------------------

      - name: Restart deployments
        run: |

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"
          do

            echo "Restarting $DEPLOYMENT..."

            kubectl rollout restart \
              deployment/"$DEPLOYMENT"

          done

      # --------------------------------------------------------
      # Wait for deployments
      # --------------------------------------------------------

      - name: Wait for deployments
        run: |

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"
          do

            echo ""
            echo "======================================"
            echo "WAITING FOR $DEPLOYMENT"
            echo "======================================"

            if ! kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=5m
            then

              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED: $DEPLOYMENT"
              echo "======================================"

              kubectl get pods -o wide

              echo ""
              kubectl describe deployment "$DEPLOYMENT"

              echo ""
              kubectl get events \
                --sort-by=.lastTimestamp \
                | tail -50

              exit 1

            fi

          done

      # --------------------------------------------------------
      # Cluster status
      # --------------------------------------------------------

      - name: Show cluster status
        if: always()
        run: |

          echo "======================================"
          echo "NODES"
          echo "======================================"

          kubectl get nodes -o wide

          echo ""
          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods -o wide

          echo ""
          echo "======================================"
          echo "SERVICES"
          echo "======================================"

          kubectl get services

      # --------------------------------------------------------
      # Debug failed pods
      # --------------------------------------------------------

      - name: Debug failed pods
        if: failure()
        run: |

          echo "======================================"
          echo "FAILED PODS"
          echo "======================================"

          kubectl get pods \
            --field-selector=status.phase!=Running \
            -o wide || true

          echo ""
          echo "======================================"
          echo "POD EVENTS"
          echo "======================================"

          kubectl get events \
            --sort-by=.lastTimestamp \
            | tail -100 || true

          echo ""
          echo "======================================"
          echo "DESCRIBE PODS"
          echo "======================================"

          for POD in $(kubectl get pods \
            --no-headers \
            | awk '$3 != "Running" && $3 != "Completed" {print $1}')
          do

            echo ""
            echo "--------------------------------------"
            echo "$POD"
            echo "--------------------------------------"

            kubectl describe pod "$POD" || true

          done

      # --------------------------------------------------------
      # LoadBalancer
      # --------------------------------------------------------

      - name: Get application URL
        if: success()
        run: |

          echo "======================================"
          echo "WAITING FOR LOAD BALANCER"
          echo "======================================"

          FRONTEND_URL=""

          for i in {1..30}
          do

            FRONTEND_URL=$(kubectl get service frontend-external \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$FRONTEND_URL" ]; then
              break
            fi

            echo "LoadBalancer not ready..."
            sleep 10

          done

          if [ -n "$FRONTEND_URL" ]; then

            echo ""
            echo "======================================"
            echo "APPLICATION"
            echo "======================================"

            echo "http://${FRONTEND_URL}"

            echo "FRONTEND_URL=http://${FRONTEND_URL}" \
              >> "$GITHUB_ENV"

          else

            echo "LoadBalancer hostname not available."

            kubectl get service frontend-external

          fi

      # --------------------------------------------------------
      # GitHub Actions summary
      # --------------------------------------------------------

      - name: Deployment summary
        if: always()
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

        run: |

          echo "# 🚀 Deployment Report" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## Image Tag" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "\`$IMAGE_TAG\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## EKS Cluster" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "\`$EKS_CLUSTER\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## AWS Region" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "\`$AWS_REGION\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## Pods" \
            >> "$GITHUB_STEP_SUMMARY"

          echo '```' \
            >> "$GITHUB_STEP_SUMMARY"

          kubectl get pods \
            >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## Services" \
            >> "$GITHUB_STEP_SUMMARY"

          echo '```' \
            >> "$GITHUB_STEP_SUMMARY"

          kubectl get services \
            >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## Application" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FRONTEND_URL:-}" ]; then
            echo "$FRONTEND_URL" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LoadBalancer URL not available." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
