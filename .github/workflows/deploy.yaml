
name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

jobs:

  # ============================================================
  # DETECT CHANGES
  # ============================================================

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DETECTING CHANGES"
          echo "======================================"

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          CHANGED_SERVICES=()

          # ------------------------------------------------------
          # workflow_dispatch = rebuild everything
          # ------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual workflow execution detected."
            echo "Building all services."

            CHANGED_SERVICES=("${SERVICES[@]}")

          else

            # ----------------------------------------------------
            # Get changed files
            # ----------------------------------------------------

            git diff --name-only HEAD^ HEAD > /tmp/changed-files.txt

            echo ""
            echo "Changed files:"
            cat /tmp/changed-files.txt

            # ----------------------------------------------------
            # Detect services
            # ----------------------------------------------------

            for SERVICE in "${SERVICES[@]}"; do

              if grep -q "^src/$SERVICE/" /tmp/changed-files.txt; then
                CHANGED_SERVICES+=("$SERVICE")
                continue
              fi

              # cartservice special case
              if [ "$SERVICE" = "cartservice" ]; then
                if grep -q "^src/cartservice/" /tmp/changed-files.txt; then
                  CHANGED_SERVICES+=("$SERVICE")
                fi
              fi

            done

            # ----------------------------------------------------
            # Dockerfile / shared files
            # ----------------------------------------------------

            if grep -qE '^\.github/|^kustomization.yaml$|^base/|^manifests/' \
              /tmp/changed-files.txt; then

              echo ""
              echo "Infrastructure/manifest files changed."
              echo "No image rebuild is required unless service code changed."

            fi

          fi

          # ------------------------------------------------------
          # Remove duplicates
          # ------------------------------------------------------

          if [ "${#CHANGED_SERVICES[@]}" -gt 0 ]; then

            UNIQUE_SERVICES=(
              $(printf "%s\n" "${CHANGED_SERVICES[@]}" | sort -u)
            )

          else

            UNIQUE_SERVICES=()

          fi

          # ------------------------------------------------------
          # Output JSON
          # ------------------------------------------------------

          if [ "${#UNIQUE_SERVICES[@]}" -eq 0 ]; then

            echo ""
            echo "No service code changed."
            echo "No Docker images need to be rebuilt."

            echo 'services=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"

          else

            SERVICES_JSON=$(
              printf '%s\n' "${UNIQUE_SERVICES[@]}" |
              jq -R -s -c 'split("\n") | map(select(length > 0))'
            )

            echo ""
            echo "Services that changed:"
            echo "$SERVICES_JSON"

            echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # BUILD AND PUSH ONLY CHANGED SERVICES
  # ============================================================

  build-and-push:
    name: Build and Push Changed Images
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Building:"
          echo "${{ matrix.service }}:$IMAGE_TAG"

      - name: Build and Push Image
        shell: bash
        run: |
          set -e

          SERVICE="${{ matrix.service }}"

          echo "======================================"
          echo "BUILDING: $SERVICE"
          echo "======================================"

          CONTEXT="src/$SERVICE"
          DOCKERFILE="$CONTEXT/Dockerfile"

          # cartservice special configuration
          if [ "$SERVICE" = "cartservice" ]; then
            CONTEXT="src/cartservice/src"
            DOCKERFILE="src/cartservice/src/Dockerfile"
          fi

          echo "Dockerfile: $DOCKERFILE"
          echo "Context:    $CONTEXT"

          test -f "$DOCKERFILE"

          if [ "$SERVICE" = "cartservice" ]; then
            test -f "$CONTEXT/cartservice.csproj"
          fi

          docker buildx build \
            --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --tag "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG" \
            --push \
            "$CONTEXT"

          echo ""
          echo "Successfully pushed:"
          echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"


  # ============================================================
  # DEPLOY TO EKS
  # ============================================================

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-and-push

    # Execute even when build-and-push was skipped
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.has_changes == 'true' ||
        needs.build-and-push.result == 'skipped'
      )

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # EKS
      # ========================================================

      - name: Verify EKS Cluster
        run: |
          aws eks describe-cluster \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

      - name: Install kubectl
        shell: bash
        run: |
          set -e

          KUBECTL_VERSION=$(curl -L -s \
            https://dl.k8s.io/release/stable.txt)

          curl -LO \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl

          sudo mv kubectl /usr/local/bin/kubectl

          kubectl version --client

      # ========================================================
      # KUSTOMIZE
      # ========================================================

      - name: Install Kustomize
        shell: bash
        run: |
          set -e

          KUSTOMIZE_VERSION="v5.7.1"

          curl -L \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz

          mkdir -p /tmp/kustomize

          tar -xzf /tmp/kustomize.tar.gz \
            -C /tmp/kustomize

          sudo install \
            /tmp/kustomize/kustomize \
            /usr/local/bin/kustomize

          kustomize version

      # ========================================================
      # CONFIGURE KUBECTL
      # ========================================================

      - name: Configure kubectl for EKS
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          kubectl cluster-info

          echo ""
          kubectl get nodes -o wide

      # ========================================================
      # UPDATE IMAGES
      # ========================================================

      - name: Update Kubernetes Images
        shell: bash
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "======================================"
          echo "UPDATING KUBERNETES IMAGES"
          echo "======================================"

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          # ------------------------------------------------------
          # Only change images that were rebuilt
          # ------------------------------------------------------

          if [ "${{ needs.detect-changes.outputs.has_changes }}" = "true" ]; then

            CHANGED='${{ needs.detect-changes.outputs.services }}'

            echo "Changed services:"
            echo "$CHANGED"

            for SERVICE in $(echo "$CHANGED" | jq -r '.[]'); do

              echo ""
              echo "Updating $SERVICE"

              kustomize edit set image \
                "$ECR_REGISTRY/$SERVICE=$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

            done

          else

            echo "No service images changed."
            echo "Keeping existing image versions."

          fi

          echo ""
          echo "Final kustomization.yaml:"
          cat kustomization.yaml

      # ========================================================
      # VALIDATE
      # ========================================================

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |
          set -e

          kustomize build . > /tmp/rendered.yaml

          kubectl apply \
            --dry-run=client \
            -f /tmp/rendered.yaml

          echo "Manifest validation successful."

      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy to EKS
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DEPLOYING TO EKS"
          echo "======================================"

          kustomize build . | kubectl apply -f -

      # ========================================================
      # STATUS
      # ========================================================

      - name: Show Deployment Status
        run: |
          echo "======================================"
          echo "DEPLOYMENT STATUS"
          echo "======================================"

          kubectl get deployments

          echo ""
          kubectl get pods -o wide

          echo ""
          kubectl get services

      # ========================================================
      # WAIT
      # ========================================================

      - name: Wait for Deployments
        shell: bash
        run: |
          set +e

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          FAILED=0

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo ""
            echo "Waiting for $DEPLOYMENT..."

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=5m

            if [ $? -ne 0 ]; then
              echo "FAILED: $DEPLOYMENT"
              FAILED=1
            else
              echo "READY: $DEPLOYMENT"
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ========================================================
      # DIAGNOSTICS
      # ========================================================

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL CLUSTER STATUS"
          echo "======================================"

          echo ""
          echo "NODES:"
          kubectl get nodes -o wide || true

          echo ""
          echo "PODS:"
          kubectl get pods -o wide || true

          echo ""
          echo "DEPLOYMENTS:"
          kubectl get deployments || true

          echo ""
          echo "SERVICES:"
          kubectl get services || true

          echo ""
          echo "RECENT EVENTS:"
          kubectl get events \
            --sort-by='.lastTimestamp' \
            | tail -100 || true
