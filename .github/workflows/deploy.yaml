name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

jobs:

  # ============================================================
  # DETECT CHANGES
  # ============================================================

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      manifests_changed: ${{ steps.detect.outputs.manifests_changed }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        shell: bash
        run: |

          set -e

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          CHANGED_SERVICES=()

          echo "======================================"
          echo "CHECKING CHANGED FILES"
          echo "======================================"

          git diff --name-only HEAD^ HEAD

          for SERVICE in "${SERVICES[@]}"; do

            if git diff --quiet HEAD^ HEAD -- "src/$SERVICE"; then

              echo "UNCHANGED: $SERVICE"

            else

              echo "CHANGED:   $SERVICE"
              CHANGED_SERVICES+=("$SERVICE")

            fi

          done

          # ======================================================
          # CONVERT TO JSON
          # ======================================================

          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then

            SERVICES_JSON="[]"
            HAS_CHANGES="false"

          else

            SERVICES_JSON=$(
              printf '%s\n' "${CHANGED_SERVICES[@]}" |
              jq -R . |
              jq -sc .
            )

            HAS_CHANGES="true"

          fi

          # ======================================================
          # KUBERNETES CHANGES
          # ======================================================

          if git diff --quiet HEAD^ HEAD -- \
            kustomization.yaml \
            kustomize/ \
            kubernetes/ \
            k8s/ \
            manifests/; then

            MANIFESTS_CHANGED="false"

          else

            MANIFESTS_CHANGED="true"

          fi

          echo ""
          echo "Changed services:"
          echo "$SERVICES_JSON"

          echo ""
          echo "Has image changes: $HAS_CHANGES"

          echo ""
          echo "Kubernetes changes: $MANIFESTS_CHANGED"

          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "manifests_changed=$MANIFESTS_CHANGED" >> "$GITHUB_OUTPUT"


  # ============================================================
  # BUILD AND PUSH
  # ============================================================

  build-and-push:
    name: Build and Push Changed Images
    runs-on: ubuntu-latest

    needs: detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # AWS CREDENTIALS - KEEP WORKING ROLE
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # ECR
      # ========================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================
      # BUILDX
      # ========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # IMAGE TAG
      # ========================================================

      - name: Set Image Tag
        shell: bash
        run: |

          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG"
          echo "======================================"
          echo "$IMAGE_TAG"

      # ========================================================
      # BUILD AND PUSH
      # ========================================================

      - name: Build and Push Changed Images
        shell: bash
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}

        run: |

          set -e

          echo "======================================"
          echo "BUILDING CHANGED SERVICES"
          echo "======================================"

          mapfile -t SERVICES < <(
            echo "$CHANGED_SERVICES" | jq -r '.[]'
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "======================================"
            echo "BUILDING: $SERVICE"
            echo "======================================"

            CONTEXT="src/$SERVICE"
            DOCKERFILE="$CONTEXT/Dockerfile"

            # Cartservice special structure
            if [ "$SERVICE" = "cartservice" ]; then

              CONTEXT="src/cartservice/src"
              DOCKERFILE="src/cartservice/src/Dockerfile"

            fi

            echo "Dockerfile: $DOCKERFILE"
            echo "Context:    $CONTEXT"

            test -f "$DOCKERFILE"

            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --tag "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG" \
              --tag "$ECR_REGISTRY/$SERVICE:latest" \
              --push \
              "$CONTEXT"

            echo ""
            echo "Successfully pushed:"
            echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

          done


  # ============================================================
  # DEPLOY TO EKS
  # ============================================================

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-and-push

    if: |
      always() &&
      (
        needs.detect-changes.outputs.has_changes == 'true' ||
        needs.detect-changes.outputs.manifests_changed == 'true'
      ) &&
      needs.build-and-push.result != 'failure'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # FORCE UPDATED IMAGES
      # ========================================================

      - name: Force updated images
        shell: bash
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |

          set -e

          echo "======================================"
          echo "FORCING UPDATED IMAGES"
          echo "======================================"

          if [ "$CHANGED_SERVICES" = "[]" ]; then

            echo "No service image changes."

          else

            mapfile -t SERVICES < <(
              echo "$CHANGED_SERVICES" | jq -r '.[]'
            )

            for SERVICE in "${SERVICES[@]}"; do

              echo ""
              echo "Updating $SERVICE..."

              kubectl set image \
                deployment/"$SERVICE" \
                server="$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

              echo "Image:"
              echo "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

            done

          fi

      # ========================================================
      # AWS
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # EKS
      # ========================================================

      - name: Configure kubectl
        shell: bash
        run: |

          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo "======================================"
          echo "CLUSTER"
          echo "======================================"

          kubectl cluster-info

          echo ""
          kubectl get nodes -o wide

      # ========================================================
      # INSTALL KUSTOMIZE
      # ========================================================

      - name: Install Kustomize
        shell: bash
        run: |

          set -e

          KUSTOMIZE_VERSION="v5.7.1"

          curl -L \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz

          tar -xzf /tmp/kustomize.tar.gz -C /tmp

          sudo mv /tmp/kustomize /usr/local/bin/kustomize

          kustomize version

      # ========================================================
      # FIND KUSTOMIZATION
      # ========================================================

      - name: Find Kustomization
        shell: bash
        run: |

          set -e

          KUSTOMIZATION_FILE=$(find . \
            -name kustomization.yaml \
            -type f \
            | head -1)

          if [ -z "$KUSTOMIZATION_FILE" ]; then

            echo "ERROR: kustomization.yaml not found"
            exit 1

          fi

          KUSTOMIZATION_DIR=$(dirname "$KUSTOMIZATION_FILE")

          echo "KUSTOMIZATION_FILE=$KUSTOMIZATION_FILE" >> "$GITHUB_ENV"
          echo "KUSTOMIZATION_DIR=$KUSTOMIZATION_DIR" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$KUSTOMIZATION_FILE"

      # ========================================================
      # IMAGE TAG
      # ========================================================

      - name: Set Image Tag
        shell: bash
        run: |

          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "IMAGE TAG:"
          echo "$IMAGE_TAG"

      # ========================================================
      # UPDATE ONLY CHANGED IMAGES
      # ========================================================

      - name: Update Changed Kubernetes Images
        shell: bash
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}

        run: |

          set -e

          cd "$KUSTOMIZATION_DIR"

          echo "======================================"
          echo "UPDATING KUBERNETES IMAGES"
          echo "======================================"

          if [ "$CHANGED_SERVICES" = "[]" ]; then

            echo "No service images changed."

          else

            mapfile -t SERVICES < <(
              echo "$CHANGED_SERVICES" | jq -r '.[]'
            )

            for SERVICE in "${SERVICES[@]}"; do

              echo ""
              echo "Updating:"
              echo "$SERVICE:$IMAGE_TAG"

              kustomize edit set image \
                "$ECR_REGISTRY/$SERVICE=$ECR_REGISTRY/$SERVICE:$IMAGE_TAG"

            done

          fi

          echo ""
          echo "======================================"
          echo "FINAL KUSTOMIZATION"
          echo "======================================"

          cat kustomization.yaml

      # ========================================================
      # VALIDATE
      # ========================================================

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |

          set -e

          cd "$KUSTOMIZATION_DIR"

          echo "======================================"
          echo "BUILDING MANIFESTS"
          echo "======================================"

          kustomize build . > /tmp/rendered.yaml

          kubectl apply \
            --dry-run=client \
            -f /tmp/rendered.yaml

          echo ""
          echo "Manifest validation successful."

      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy to EKS
        shell: bash
        run: |

          set -e

          cd "$KUSTOMIZATION_DIR"

          echo "======================================"
          echo "DEPLOYING TO EKS"
          echo "======================================"

          kustomize build . | kubectl apply -f -

          echo ""
          echo "Deployment applied."

      # ========================================================
      # WAIT FOR CARTSERVICE
      # ========================================================

      - name: Wait for cartservice
        run: |

          kubectl rollout status \
            deployment/cartservice \
            --timeout=300s

      # ========================================================
      # WAIT FOR FRONTEND
      # ========================================================

      - name: Wait for frontend
        run: |

          kubectl rollout status \
            deployment/frontend \
            --timeout=300s

      # ========================================================
      # WAIT FOR ALL DEPLOYMENTS
      # ========================================================

      - name: Wait for all deployments
        run: |

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          FAILED=0

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo ""
            echo "Waiting for $DEPLOYMENT..."

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=300s

            if [ $? -ne 0 ]; then
              echo "FAILED: $DEPLOYMENT"
              FAILED=1
            else
              echo "READY: $DEPLOYMENT"
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ========================================================
      # SET VALKEY ENDPOINT
      # ========================================================

      - name: Configure Valkey Endpoint
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "CONFIGURING CARTSERVICE VALKEY"
          echo "======================================"

          VALKEY_ENDPOINT="googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True"

          kubectl set env deployment/cartservice \
            REDIS_ADDR="$VALKEY_ENDPOINT"

          echo ""
          echo "Valkey endpoint configured."

          echo ""
          echo "Current REDIS_ADDR:"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}'

          echo ""

      # ========================================================
      # WAIT FOR CARTSERVICE AFTER REDIS CHANGE
      # ========================================================

      - name: Wait for cartservice after Valkey configuration
        run: |

          kubectl rollout status \
            deployment/cartservice \
            --timeout=300s

      # ========================================================
      # FINAL STATUS
      # ========================================================

      - name: Show Deployment Status
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "DEPLOYMENT STATUS"
          echo "======================================"

          echo ""
          echo "DEPLOYMENTS:"

          kubectl get deployments

          echo ""
          echo "PODS:"

          kubectl get pods -o wide

          echo ""
          echo "SERVICES:"

          kubectl get services

          echo ""
          echo "FRONTEND IMAGE:"

          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            || true

          echo ""

          echo ""
          echo "CARTSERVICE IMAGE:"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            || true

          echo ""

          echo ""
          echo "CARTSERVICE REDIS:"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}' \
            || true

          echo ""

      # ========================================================
      # DIAGNOSTICS
      # ========================================================

      - name: Diagnostics
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "FINAL CLUSTER STATUS"
          echo "======================================"

          echo ""
          echo "NODES:"

          kubectl get nodes -o wide || true

          echo ""
          echo "PODS:"

          kubectl get pods -o wide || true

          echo ""
          echo "DEPLOYMENTS:"

          kubectl get deployments || true

          echo ""
          echo "SERVICES:"

          kubectl get services || true

          echo ""
          echo "RECENT EVENTS:"

          kubectl get events \
            --sort-by='.lastTimestamp' |
            tail -100 || true
