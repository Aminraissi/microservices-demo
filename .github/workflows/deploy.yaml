name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

jobs:

  build-push-deploy:

    name: Build, Push to ECR and Deploy to EKS

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. CONFIGURE AWS
      # ============================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================
      # 3. LOGIN TO ECR
      # ============================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================
      # 4. CREATE IMAGE TAG
      # ============================================

      - name: Create image tag
        id: vars
        run: |
          TAG=$(git rev-parse --short HEAD)-${GITHUB_RUN_NUMBER}

          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "IMAGE TAG: $TAG"
          echo "======================================"


      # ============================================
      # 5. BUILD AND PUSH IMAGES
      # ============================================

      - name: Build and push Docker images
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo ""
            echo "======================================"
            echo "BUILDING: $SERVICE"
            echo "======================================"

            docker build \
              -t "$ECR_REGISTRY/$SERVICE:$TAG" \
              "./src/$SERVICE"

            echo "PUSHING: $SERVICE"

            docker push \
              "$ECR_REGISTRY/$SERVICE:$TAG"

          done


      # ============================================
      # 6. INSTALL KUBECTL
      # ============================================

      - name: Install kubectl
        uses: azure/setup-kubectl@v4


      # ============================================
      # 7. INSTALL HELM
      # ============================================

      - name: Install Helm
        uses: azure/setup-helm@v4


      # ============================================
      # 8. CONNECT TO EKS
      # ============================================

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"


      # ============================================
      # 9. VERIFY EKS
      # ============================================

      - name: Verify EKS connection
        run: |

          echo "======================================"
          echo "EKS NODES"
          echo "======================================"

          kubectl get nodes

          echo ""
          echo "======================================"
          echo "CURRENT DEPLOYMENTS"
          echo "======================================"

          kubectl get deployments


      # ============================================
      # 10. HELM DEPLOYMENT
      # ============================================

      - name: Deploy application with Helm
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |

          echo "======================================"
          echo "DEPLOYING WITH HELM"
          echo "======================================"

          helm upgrade --install onlineboutique ./helm-chart \
            --namespace default \
            --create-namespace \
            --set images.repository="$ECR_REGISTRY" \
            --set images.tag="$TAG" \
            --set cartDatabase.type=redis \
            --set-string cartDatabase.connectionString="googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True" \
            --set cartDatabase.inClusterRedis.create=false \
            --set cartDatabase.externalRedisTlsOrigination.enable=false


      # ============================================
      # 11. WAIT FOR CARTSERVICE
      # ============================================

      - name: Wait for cartservice
        run: |

          kubectl rollout status \
            deployment/cartservice \
            --timeout=300s


      # ============================================
      # 12. WAIT FOR FRONTEND
      # ============================================

      - name: Wait for frontend
        run: |

          kubectl rollout status \
            deployment/frontend \
            --timeout=300s


      # ============================================
      # 13. WAIT FOR ALL DEPLOYMENTS
      # ============================================

      - name: Wait for all deployments
        run: |

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo ""
            echo "Waiting for $DEPLOYMENT..."

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=300s

          done


      # ============================================
      # 14. VERIFY REDIS CONFIGURATION
      # ============================================

      - name: Verify Redis configuration
        run: |

          echo "======================================"
          echo "REDIS CONFIGURATION"
          echo "======================================"

          echo "REDIS_ADDR:"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}'

          echo ""


      # ============================================
      # 15. VERIFY CARTSERVICE IMAGE
      # ============================================

      - name: Verify cartservice image
        run: |

          echo "======================================"
          echo "CARTSERVICE IMAGE"
          echo "======================================"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""


      # ============================================
      # 16. VERIFY FRONTEND IMAGE
      # ============================================

      - name: Verify frontend image
        run: |

          echo "======================================"
          echo "FRONTEND IMAGE"
          echo "======================================"

          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""


      # ============================================
      # 17. VERIFY PODS
      # ============================================

      - name: Verify pods
        run: |

          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods -o wide


      # ============================================
      # 18. VERIFY SERVICES
      # ============================================

      - name: Verify services
        run: |

          echo "======================================"
          echo "SERVICES"
          echo "======================================"

          kubectl get svc


      # ============================================
      # 19. FINAL STATUS
      # ============================================

      - name: Deployment summary
        run: |

          echo ""
          echo "======================================"
          echo "DEPLOYMENT COMPLETED"
          echo "======================================"

          kubectl get deployments

          echo ""
          echo "Frontend:"
          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

          echo "Cartservice Redis:"
          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}'

          echo ""
