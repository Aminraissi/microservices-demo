name: CI/CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: googleCluster
  AWS_ACCOUNT_ID: "501161805281"
  ECR_REGISTRY: "501161805281.dkr.ecr.eu-west-1.amazonaws.com"

jobs:

  # ============================================================
  # BUILD + PUSH
  # ============================================================

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT:
      # Keep the same AWS authentication that was working before.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # IMAGE TAG
      # ============================================================

      - name: Set Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG: $IMAGE_TAG"
          echo "======================================"

      # ============================================================
      # BUILD + PUSH ALL SERVICES
      # ============================================================

      - name: Build and Push All Services
        shell: bash
        run: |
          set -e

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for SERVICE in "${SERVICES[@]}"; do

            echo "======================================"
            echo "BUILDING $SERVICE"
            echo "======================================"

            CONTEXT="src/$SERVICE"
            DOCKERFILE="$CONTEXT/Dockerfile"

            # Cartservice has its Dockerfile in a different directory
            if [ "$SERVICE" = "cartservice" ]; then
              CONTEXT="src/cartservice/src"
              DOCKERFILE="src/cartservice/src/Dockerfile"
            fi

            if [ ! -f "$DOCKERFILE" ]; then
              echo "ERROR: Dockerfile not found:"
              echo "$DOCKERFILE"
              exit 1
            fi

            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --tag "$ECR_REGISTRY/$SERVICE:$IMAGE_TAG" \
              --tag "$ECR_REGISTRY/$SERVICE:latest" \
              --push \
              "$CONTEXT"

          done

  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT:
      # Same working AWS role.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501161805281:role/test
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ============================================================
      # EKS
      # ============================================================

      - name: Configure kubectl
        shell: bash
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo "======================================"
          echo "CLUSTER"
          echo "======================================"

          kubectl cluster-info

          echo "======================================"
          echo "NODES"
          echo "======================================"

          kubectl get nodes -o wide

      # ============================================================
      # HELM
      # ============================================================

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Find Helm Chart
        shell: bash
        run: |
          set -e

          CHART_FILE=$(find . -name Chart.yaml -type f | head -1)

          if [ -z "$CHART_FILE" ]; then
            echo "ERROR: Chart.yaml not found"
            exit 1
          fi

          HELM_CHART_DIR=$(dirname "$CHART_FILE")

          echo "HELM_CHART_DIR=$HELM_CHART_DIR" >> "$GITHUB_ENV"

          echo "Helm chart:"
          echo "$HELM_CHART_DIR"

      # ============================================================
      # IMAGE TAG
      # ============================================================

      - name: Set Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG"
          echo "$IMAGE_TAG"
          echo "======================================"

      # ============================================================
      # CHECK VALUES
      # ============================================================

      - name: Verify values.yaml
        shell: bash
        run: |
          set -e

          VALUES_FILE="$HELM_CHART_DIR/values.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: values.yaml not found"
            exit 1
          fi

          echo "======================================"
          echo "CART DATABASE CONFIGURATION"
          echo "======================================"

          grep -A20 "^cartDatabase:" "$VALUES_FILE"

          echo "======================================"
          echo "IMAGE CONFIGURATION"
          echo "======================================"

          grep -A3 "^images:" "$VALUES_FILE"

      # ============================================================
      # HELM TEMPLATE VALIDATION
      # ============================================================

      - name: Render Helm Manifests
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RENDERING HELM"
          echo "======================================"

          helm template onlineboutique "$HELM_CHART_DIR" \
            --namespace default \
            --set-string images.repository="$ECR_REGISTRY" \
            --set-string images.tag="$IMAGE_TAG" \
            --set-string cartDatabase.connectionString="googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True" \
            --set cartDatabase.inClusterRedis.create=false \
            --set cartDatabase.externalRedisTlsOrigination.enable=false \
            > /tmp/rendered.yaml

          echo "Helm rendering successful."

          echo ""
          echo "======================================"
          echo "REDIS CONFIGURATION"
          echo "======================================"

          grep -A3 -B3 "REDIS_ADDR" /tmp/rendered.yaml || true

          echo ""
          echo "======================================"
          echo "CHECK REDIS TLS"
          echo "======================================"

          if ! grep -q \
            'googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True' \
            /tmp/rendered.yaml; then

            echo "ERROR: Redis TLS configuration was not rendered."
            exit 1
          fi

          echo "Redis TLS configuration OK."

          echo ""
          echo "======================================"
          echo "CHECK ISTIO"
          echo "======================================"

          if grep -q 'kind: DestinationRule' /tmp/rendered.yaml; then
            echo "ERROR: DestinationRule detected."
            exit 1
          fi

          if grep -q 'kind: ServiceEntry' /tmp/rendered.yaml; then
            echo "ERROR: ServiceEntry detected."
            exit 1
          fi

          echo "No Istio Redis TLS resources detected."

      # ============================================================
      # HELM DEPLOYMENT
      # ============================================================

      - name: Deploy with Helm
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DEPLOYING WITH HELM"
          echo "======================================"

          helm upgrade --install onlineboutique "$HELM_CHART_DIR" \
            --namespace default \
            --set-string images.repository="$ECR_REGISTRY" \
            --set-string images.tag="$IMAGE_TAG" \
            --set-string cartDatabase.connectionString="googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True" \
            --set cartDatabase.inClusterRedis.create=false \
            --set cartDatabase.externalRedisTlsOrigination.enable=false \
            --wait \
            --timeout 10m

          echo "======================================"
          echo "HELM DEPLOYMENT SUCCESSFUL"
          echo "======================================"

      # ============================================================
      # CARTSERVICE
      # ============================================================

      - name: Verify Cartservice
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "WAITING FOR CARTSERVICE"
          echo "======================================"

          kubectl rollout status \
            deployment/cartservice \
            --timeout=5m

          echo ""
          echo "======================================"
          echo "CARTSERVICE IMAGE"
          echo "======================================"

          IMAGE=$(kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo "$IMAGE"

          echo ""
          echo "======================================"
          echo "REDIS ADDRESS"
          echo "======================================"

          REDIS_ADDR=$(kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}')

          echo "$REDIS_ADDR"

          echo ""
          echo "======================================"
          echo "VERIFY REDIS TLS"
          echo "======================================"

          EXPECTED="googlecluster-88y4r8.serverless.euw1.cache.amazonaws.com:6379,ssl=True"

          if [ "$REDIS_ADDR" != "$EXPECTED" ]; then
            echo "ERROR: Incorrect REDIS_ADDR"
            echo "Expected:"
            echo "$EXPECTED"
            echo "Actual:"
            echo "$REDIS_ADDR"
            exit 1
          fi

          echo "Redis TLS configuration is correct."

      # ============================================================
      # FRONTEND
      # ============================================================

      - name: Verify Frontend
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "WAITING FOR FRONTEND"
          echo "======================================"

          kubectl rollout status \
            deployment/frontend \
            --timeout=5m

          echo ""
          echo "======================================"
          echo "FRONTEND IMAGE"
          echo "======================================"

          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

      # ============================================================
      # ALL DEPLOYMENTS
      # ============================================================

      - name: Wait for All Deployments
        shell: bash
        run: |
          set -e

          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do

            echo "======================================"
            echo "WAITING FOR $DEPLOYMENT"
            echo "======================================"

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              --timeout=5m

          done

      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: Final Status
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "DEPLOYMENTS"
          echo "======================================"

          kubectl get deployments || true

          echo ""
          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods -o wide || true

          echo ""
          echo "======================================"
          echo "SERVICES"
          echo "======================================"

          kubectl get services || true

          echo ""
          echo "======================================"
          echo "FRONTEND IMAGE"
          echo "======================================"

          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            || true

          echo

          echo ""
          echo "======================================"
          echo "CARTSERVICE IMAGE"
          echo "======================================"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            || true

          echo

          echo ""
          echo "======================================"
          echo "CARTSERVICE REDIS"
          echo "======================================"

          kubectl get deployment cartservice \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REDIS_ADDR")].value}' \
            || true

          echo

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |

          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods -o wide || true

          echo ""
          echo "======================================"
          echo "CARTSERVICE DESCRIPTION"
          echo "======================================"

          kubectl describe deployment cartservice || true

          echo ""
          echo "======================================"
          echo "CARTSERVICE LOGS"
          echo "======================================"

          kubectl logs deployment/cartservice \
            --tail=100 || true

          echo ""
          echo "======================================"
          echo "EVENTS"
          echo "======================================"

          kubectl get events \
            --sort-by='.lastTimestamp' \
            | tail -100 || true
